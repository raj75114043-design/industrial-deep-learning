name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (data, models, API with the committed weights)
        run: pytest -q
      - name: Retrain all three models from scratch and apply the quality gate
        run: python -m indl.eval.run --gate --out reports/eval-ci.json
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: eval-report, path: reports/eval-ci.json}

  docker:
    needs: [quality]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
