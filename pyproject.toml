[project]
name = "industrial-deep-learning"
version = "1.0.0"
description = "Deep learning for tablet manufacturing: ANN dissolution prediction, CNN visual inspection, LSTM punch RUL"
requires-python = ">=3.10"

[tool.ruff]
line-length = 170
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B008", "UP007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
